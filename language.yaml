settings:
  heading: "Settings"
  description: "Server-wide settings for everyone using this app. Changes apply to videos processed after you save; nothing needs a restart. Defaults come from config.yaml and app/pipeline/tunables.py."
  save_button: "Save changes"
  discard_button: "Discard"
  saved_notice: "Saved. New jobs use these settings."
  unsaved_notice: "Unsaved changes"
  reset_button: "Reset"
  default_label: "Default: {value}"
  changed_label: "changed"
  value_on: "on"
  value_off: "off"
  secret_set: "set (leave blank to keep)"
  secret_unset: "not set"
  redirect_hint: "Register this exact address as an Authorized redirect URI on the Google Cloud client:"
  google_steps: "One-time setup in Google Cloud (console.cloud.google.com): enable the Google Drive API; under Google Auth Platform set Branding and Audience (External — add your Google account as a Test user, or publish the app); then Clients → Create client → Web application, with the redirect address below. Paste its Client ID and secret here."
  auto: "auto"
  groups:
    processing: "Processing"
    google: "Google Slides"
    scan: "Slide-change detection"
    capture: "Capture timing"
    noise: "Talking-head suppression"
    duplicates: "Duplicate filtering"
    builds: "Incremental builds"
    output: "Output"
  # {cpu} is the processor's name; {cores} logical cores, {physical} physical ones.
  machine: "This computer: {cpu} — {cores} cores"
  machine_physical: "This computer: {cpu} — {physical} cores, {cores} threads"
  # {count} cores of {total}.
  cores_value: "{count} of {total} cores"
  cores_all: "All {total} cores (no limit)"
  cores_default: "no limit"
  fields:
    cpu_limit:
      label: "CPU cores to use"
      help: "How many cores processing may keep busy, shared between the videos processed at once. All the way right is as fast as possible; lower it to keep the computer usable while videos process. Applies to videos started after saving."
    low_priority:
      label: "Run in the background"
      help: "Processing gives way to everything else on the computer, so the mouse and other apps stay responsive. It still uses idle cores fully, so it is barely slower."
    downloads_ahead:
      label: "YouTube videos downloaded ahead"
      help: "While one video is processed, the next ones download, so processing never waits on the network. One downloads at a time; this many may be waiting on disk. 0 = download each only when its turn comes."
    max_concurrent:
      label: "Videos processed at once"
      help: "Each video already uses every core while scanning, so more than 1–2 mostly makes them all finish later."
    scan_workers:
      label: "Scan decoders per video"
      help: "Parallel ffmpeg decoders while scanning. 0 = CPU cores minus one. Capped by CPU cores to use."
    extract_workers:
      label: "Frame grabs in parallel"
      help: "ffmpeg processes capturing slide frames at once. More can cause disk contention. Capped by CPU cores to use."
    keep_source:
      label: "Keep videos after processing"
      help: "Off saves disk space. On lets uploaded videos be processed again later."
    upload_max_gb:
      label: "Largest upload (GB)"
      help: "Biggest single video accepted from the browser."
    youtube_enabled:
      label: "YouTube links"
      help: "Show the YouTube box and accept video, playlist and channel links."
    youtube_max_height:
      label: "YouTube download resolution"
      help: "Highest video height downloaded. Slides are readable well below 4K, and downloads are the slow part."
    youtube_max_playlist_items:
      label: "Playlist limit"
      help: "Playlists and channels longer than this are cut off."
    google_client_id:
      label: "OAuth client ID"
      help: "From the Google Cloud client (…apps.googleusercontent.com). Empty switches Google Slides export off."
    google_client_secret:
      label: "OAuth client secret"
      help: "Stored encrypted. It is never shown again; type a new one to replace it."
    google_redirect_url:
      label: "Redirect address"
      help: "Leave empty for the default shown below. Behind Docker or a reverse proxy, the address the browser actually uses."
    stride:
      label: "Frame step"
      help: "Compare every Nth frame. Lower catches very brief flashes, but is proportionally slower."
    coarse_diff_thresh:
      label: "Change threshold"
      help: "Average brightness change (0–255) between compared frames that counts as a slide change. Lower = more sensitive, more false positives."
    gradual_window_sec:
      label: "Fade window (s)"
      help: "Also compare frames this far apart, to catch fade transitions too gradual for frame-to-frame."
    gradual_cell_thresh:
      label: "Fade: cell change"
      help: "How much a patch of the picture must change to count towards a fade."
    gradual_min_area:
      label: "Fade: changed area"
      help: "Fraction of the picture that must change for a fade (0–1). Keeps a moving webcam pane or one new bullet from counting."
    min_gap_sec:
      label: "Minimum gap between cuts (s)"
      help: "Changes closer than this are reported once."
    min_slide_sec:
      label: "Transition burst (s)"
      help: "Cuts closer than this are one transition (dissolve, wipe, animation); only its settled end is kept."
    capture_pre_cut_sec:
      label: "Capture before next change (s)"
      help: "Each slide is captured this long before the next change, when every animated bullet has appeared."
    capture_min_after_cut_sec:
      label: "Capture after slide appears (s)"
      help: "…but never sooner than this after the slide appeared, so the transition has settled."
    noise_window_sec:
      label: "Density window (s)"
      help: "Window used to measure how often changes happen. Camera footage changes constantly; slides do not."
    noise_min_rate:
      label: "Changes per window"
      help: "This many changes inside the window marks it as camera footage. Below 4 deletes real fast slide sequences."
    noise_merge_gap_sec:
      label: "Bridge gaps under (s)"
      help: "Camera stretches separated by less than this are treated as one."
    noise_min_run_duration_sec:
      label: "Minimum camera stretch (s)"
      help: "A camera stretch must last at least this long to be dropped…"
    noise_min_run_len:
      label: "Minimum changes in stretch"
      help: "…and contain at least this many changes."
    run_exit_quiet_sec:
      label: "Quiet after camera (s)"
      help: "If nothing changes for this long after a camera stretch, its last change is kept as a slide (the cut back to the slides)."
    hash_size:
      label: "Fingerprint size"
      help: "Resolution of the perceptual fingerprint used to spot repeated captures."
    hash_dist_thresh:
      label: "Fingerprint difference"
      help: "Fingerprint bits that must differ for a capture to count as new."
    grid:
      label: "Region grid"
      help: "The picture is split into this many × this many regions for the duplicate check."
    region_cell_thresh:
      label: "Region change"
      help: "Brightness change for a region to count as changed."
    region_min_diff:
      label: "Changed regions"
      help: "Fraction of regions that must change for a capture to count as new. Both checks must agree before two captures are merged."
    build_merge_enabled:
      label: "Merge incremental builds"
      help: "Leave out captures that the next capture only adds to (bullets still appearing). They stay in the review grid, excluded."
    motion_pixel_thresh:
      label: "Live-video pixel change"
      help: "Brightness change that counts as movement when spotting live video (a webcam pane)."
    motion_min_fraction:
      label: "Live-video share"
      help: "Pixels moving in at least this fraction of the video are ignored when comparing slides."
    build_width:
      label: "Comparison width (px)"
      help: "Captures are compared at this width."
    build_bg_tolerance:
      label: "Background tolerance"
      help: "Background brightness of two captures must match within this to be the same slide."
    build_ink_thresh:
      label: "Content threshold"
      help: "Difference from the background that counts as content (text, drawings)."
    build_cell:
      label: "Comparison cell (px)"
      help: "Size of the cells changes are counted in."
    build_cell_min_pixels:
      label: "Pixels per cell"
      help: "Changed pixels a cell needs to count."
    build_min_added_cells:
      label: "Minimum added"
      help: "The next capture must add at least this many cells of content."
    build_max_loss_cells:
      label: "Maximum lost"
      help: "…while changing at most this many cells of existing content (a mouse pointer costs one or two)…"
    build_max_loss_ratio:
      label: "Maximum lost (share of added)"
      help: "…or this fraction of what it adds, if that is more."
    slide_width_in:
      label: "Deck slide width (in)"
      help: "PowerPoint slide width; the height follows the video's shape."
    thumb_width:
      label: "Thumbnail width (px)"
      help: "Size of the review-grid previews."
    jpeg_quality:
      label: "Slide image quality"
      help: "ffmpeg JPEG quality for captured slides: 2 is near-lossless, higher numbers are smaller and blurrier."
